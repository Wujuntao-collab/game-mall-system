server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:mall;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

mall:
  jwt:
    secret: game-mall-secret-key-change-me-0123456789
    expire-seconds: 7200

logging:
  level:
    com.wujuntao.mall.mapper: debug
